seed: 7
device: cpu 

paths:
  external_sdfusion: external/SDFusion
  vqvae_checkpoint: checkpoints/sdfusion/vqvae-snet-all.pth
  ddpm_checkpoint: checkpoints/ddpm/best.pt
  mesh_dir: outputs/meshes

diffusion:
  timesteps: 1000
  sample_steps: 100
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: linear

denoiser:
  name: unet3d
  latent_channels: 3
  latent_shape: [3, 16, 16, 16]
  base_channels: 128
  time_dim: 512

sampling:
  batch_size: 1
  output_name: sample_generated.ply
