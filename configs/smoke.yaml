seed: 7
device: auto

data:
  resolution: 32
  batch_size: 2
  num_samples: 8
  shape_types: ["sphere", "box"]
  truncation: 0.35

vae:
  in_channels: 1
  base_channels: 8
  latent_channels: 4
  kl_weight: 0.000001
  learning_rate: 0.001
  train_steps: 4

diffusion:
  timesteps: 12
  sample_steps: 6
  beta_start: 0.0001
  beta_end: 0.02
  unet_base_channels: 16
  learning_rate: 0.001
  train_steps: 4

outputs:
  root: outputs
  checkpoints: outputs/checkpoints
  meshes: outputs/meshes
  figures: outputs/figures

