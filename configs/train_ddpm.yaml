seed: 7
device: auto

paths:
  latent_root: data/latents
  metadata_root: data/metadata
  checkpoint_dir: checkpoints/ddpm
  log_dir: outputs/logs

data:
  category: chair
  split: train
  batch_size: 4
  num_workers: 0

diffusion:
  timesteps: 1000
  sample_steps: 100
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: linear

denoiser:
  name: unet3d
  latent_channels: 3
  base_channels: 128
  time_dim: 512

training:
  learning_rate: 0.0001
  max_steps: 200000
  save_every: 5000

